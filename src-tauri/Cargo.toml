[package]
name = "devclip"
version = "0.1.0"
description = "A clipboard history and developer toolbox"
authors = ["DevClip contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
# bundled 必须开：系统 SQLite 未必编译了 FTS5，
# 而 trigram 分词器要 SQLite >= 3.34（见 docs/03）
rusqlite = { version = "0.37", features = ["bundled"] }
# 去重用，比 sha2 快且无额外依赖
blake3 = "1"
arboard = "3.6.1"
# X11 协议。arboard 只做读写，不提供「剪贴板什么时候变了」，
# 而监听恰恰是剪贴板管理器的核心 —— 只能自己查 owner
x11rb = { version = "0.13", features = ["xtest"] }
tauri-plugin-global-shortcut = "2.4.0"
tray-icon = "0.25.1"

# 只在 macOS 上要：读前台应用、拉起目标应用。
# 走 NSWorkspace 进程内调用，不起 osascript —— 详见 clipboard.rs
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
